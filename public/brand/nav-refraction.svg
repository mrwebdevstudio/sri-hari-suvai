<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <filter id="lens" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <!-- The neutral centre leaves the backdrop unchanged; the curved rim bends it inward. -->
    <feImage x="0%" y="0%" width="100%" height="100%" preserveAspectRatio="none" xlink:href="data:image/png;base64," result="rim" />
    <feDisplacementMap in="SourceGraphic" in2="rim" scale="8" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>
